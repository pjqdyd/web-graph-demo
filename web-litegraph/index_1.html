<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>LiteGraph.js Demo</title>
    <script src="./plugin/highlight.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/litegraph.js/0.7.18/build/litegraph.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/litegraph.js/0.7.18/css/litegraph.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #container {
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        #toolbar {
            background: #f0f0f0;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        #content {
            flex: 1;
            display: flex;
        }
        #sidebar {
            width: 200px;
            background: #f8f8f8;
            border-right: 1px solid #ccc;
            padding: 10px;
        }
        #graph-container {
            flex: 1;
            position: relative;
        }
        .node-item {
            padding: 5px;
            margin: 5px 0;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
        }
        .node-item:hover {
            background: #d0d0d0;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="toolbar">
        <button onclick="saveGraph()">保存</button>
        <button onclick="loadGraph()">加载</button>
        <button onclick="clearGraph()">清除</button>
        <button onclick="startGraph()">启动图形</button>
        <button onclick="stopGraph()">停止图形</button>
        <button onclick="restartGraph()">重启图形</button>
        <button onclick="runStep()">开始执行</button>
        <button onclick="forceRunStep()">强制重新执行</button>
    </div>
    <div id="content">
        <div id="sidebar">
            <h3>节点库</h3>
            <div class="node-item" onclick="addNode('basic/start')">开始节点</div>
            <div class="node-item" onclick="addNode('basic/const')">常量节点</div>
            <div class="node-item" onclick="addNode('basic/math')">数学运算节点</div>
            <div class="node-item" onclick="addNode('basic/my-watch')">监视器节点</div>
            <div id="output">执行日志将显示在这里...</div>
        </div>
        <div id="graph-container">
            <canvas id="mycanvas" width="1024" height="620"></canvas>
        </div>
    </div>
</div>

<script src="./json/index_1.js"></script>
<script>
    // 初始化
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#mycanvas", graph);
    const outputDiv = document.getElementById("output");

    // 注册自定义节点
    class StartNode extends LGraphNode {
        constructor() {
            super();
            this.title = "开始节点";
            this.addOutput("start", LiteGraph.EVENT);
            // 设为 ON_TRIGGER 模式：拓扑循环 runStep 不会反复执行本节点，
            // 避免延迟完成回填结果时 start→math 事件连线再次闪烁
            this.mode = LiteGraph.ON_TRIGGER;
        }
        onExecute() {
            this.triggerSlot(0);
            setNodeHighlight(this, 'executed');
        }
    }

    class ConstNode extends LGraphNode {
        constructor() {
            super();
            this.title = "常量";
            this.addOutput("value", "number");
            this.properties = { value: 1.0 };
        }
        onExecute() {
            this.setOutputData(0, this.properties.value);
            setNodeHighlight(this, 'executed');
        }
    }

    class MathNode extends LGraphNode {
        constructor() {
            super();
            this.title = "数学运算";
            this.addInput("A", "number");
            this.addInput("B", "number");
            this.addInput("onTrigger", LiteGraph.EVENT);
            this.addOutput("result", "number");
            // 事件输出：延迟计算完成后通过此 slot 传播事件给下游（参照官方 events/delay）
            this.addOutput("out", LiteGraph.EVENT);
            this.properties = { operation: "add" };
            // 延迟计算状态机：保留 setTimeout 视觉延迟，但不破坏同步拓扑执行
            this._lastInputs = [null, null];
            // 记录上次运算符，运算符变化也需重新计算
            this._lastOperation = null;
            this._pendingTimer = null;
            this._computing = false;
            this._cachedResult = null;
        }
        // 收到开始节点事件时触发自身计算（标准 ACTION 输入 + onAction 模式）
        onAction() {
            this.onExecute();
        }
        onExecute() {
            const inputA = this.getInputData(0);
            const inputB = this.getInputData(1);

            // 输入未就绪时输出空，不启动计算
            if (inputA == null || inputB == null) {
                this.setOutputData(0, null);
                return;
            }

            // 输入或运算符变化（或首次执行）→ 启动延迟计算
            if (this._lastInputs[0] !== inputA
                || this._lastInputs[1] !== inputB
                || this._lastOperation !== this.properties.operation) {
                this._lastInputs = [inputA, inputB];
                this._lastOperation = this.properties.operation;
                this._computing = true;
                setNodeHighlight(this, 'executing');
                this.setOutputData(0, null);

                clearTimeout(this._pendingTimer);
                this._pendingTimer = setTimeout(() => {
                    this._cachedResult = this._compute(inputA, inputB);
                    this._computing = false;
                    this.setOutputData(0, this._cachedResult);
                    setNodeHighlight(this, 'executed');
                    // 按官方 events/delay 模式：计算完成后通过事件输出传播给下游，
                    // 让 math→watch 连线产生流动高亮动画
                    this.triggerSlot(1, this._cachedResult);
                    // 执行一次拓扑消费下游 deferred action；start 已设为 ON_TRIGGER 不会被反复执行
                    if (this.graph) {
                        this.graph.runStep(1, false);
                    }
                    this.setDirtyCanvas(true, true);
                }, 1500);
                return;
            }

            // 计算中保持空
            if (this._computing) {
                this.setOutputData(0, null);
                return;
            }

            // 已完成则保持结果
            this.setOutputData(0, this._cachedResult);
        }
        _compute(inputA, inputB) {
            switch (this.properties.operation) {
                case "add": return inputA + inputB;
                case "sub": return inputA - inputB;
                case "mul": return inputA * inputB;
                case "div": return inputA / inputB;
                default: return 0;
            }
        }
    }

    class WatchNode extends LGraphNode {
        constructor() {
            super();
            this.title = "值监视器";
            this.addInput("value", "");
            // 事件输入：接收上游完成事件，触发显示刷新（参照官方 ACTION 输入模式）
            this.addInput("onTrigger", LiteGraph.ACTION);
            this.value = null;
        }
        onExecute() {
            this.value = this.getInputData(0);
            setNodeHighlight(this, 'executed');
            this.setDirtyCanvas(true, true);
        }
        // 收到上游事件时读取数据值并刷新显示（事件驱动的执行时机）
        onAction() {
            this.value = this.getInputData(0);
            setNodeHighlight(this, 'executed');
            this.setDirtyCanvas(true, true);
        }
        onDrawBackground(ctx) {
            ctx.fillStyle = "#FFF";
            ctx.font = "12px Arial";

            // value 为 null 时显示空，否则显示值
            const displayValue = this.value == null
                ? ""
                : (typeof this.value === 'object'
                    ? JSON.stringify(this.value)
                    : String(this.value));

            ctx.fillText(`value: ${displayValue}`, 10, 30);
        }
    }

    // 注册节点
    LiteGraph.registerNodeType("basic/start", StartNode);
    LiteGraph.registerNodeType("basic/const", ConstNode);
    LiteGraph.registerNodeType("basic/math", MathNode);
    LiteGraph.registerNodeType("basic/my-watch", WatchNode);

    // 节点管理函数
    function addNode(type) {
        const node = LiteGraph.createNode(type);
        node.pos = [200 + Math.ceil(Math.random() * 50), 200 + Math.ceil(Math.random() * 50)];
        graph.add(node);
        if (type === "basic/start") {
            graph.startNode = node;
        }
    }

    function saveGraph() {
        const data = graph.serialize();
        localStorage.setItem("my_graph", JSON.stringify(data));
        outputDiv.innerHTML = "图形已保存";
    }

    function loadGraph() {
        const jsonData = localStorage.getItem("my_graph");
        const data = jsonData ? JSON.parse(jsonData) : JSON.parse(Index_1_JsonData);
        if (data) {
            graph.configure(data);
            graph.startNode = graph._nodes.find(node => node.type === 'basic/start') || null;
            outputDiv.innerHTML = "图形已加载";
        } else {
            outputDiv.innerHTML = "没有找到保存的图形";
        }
    }

    function clearGraph() {
        if (confirm("确定要清除图形吗？")) {
            graph.clear();
        }
    }

    // 控制函数
    function startGraph() {
        graph.start();
        // 更新画布
        graph.setDirtyCanvas(true, true);
        outputDiv.innerHTML = "图形已启动";
    }

    function stopGraph() {
        graph.stop();
        outputDiv.innerHTML = "图形已停止";
    }

    function runStep() {
        if (graph.startNode) {
            graph.startNode.onExecute();
        }
        // 执行一次拓扑，让常量节点提供数据并完成计算
        graph.runStep(1, false);
        graph.setDirtyCanvas(true, true);
        outputDiv.innerHTML = "执行开始完成";
    }

    function forceRunStep() {
        // 强制重新执行所有节点
        graph.runStep(1, false);
        graph.setDirtyCanvas(true, true);
        outputDiv.innerHTML = "强制重新执行完成";
    }

    function restartGraph() {
        graph.stop();
        graph.start();
        graph.setDirtyCanvas(true, true);
        outputDiv.innerHTML = "图形已重启";
    }

    // 加载图形
    loadGraph()
</script>
</body>
</html>
